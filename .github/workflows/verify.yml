# The checks that can run without a person watching a window.
#
# Windows rather than Linux, because `requirements.txt` pins pywin32 and there
# is no version of it to install anywhere else. The tests themselves are
# platform-neutral -- the session table is injected rather than read and a hung
# worker is reproduced with a signal -- but the environment they run in is not.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Qt needs somewhere to draw even when nothing is shown. Without this the
      # model tests fail on the runner and pass everywhere else, which is the
      # least useful kind of failure.
      #
      # Through tools/run_tests.py, as release.yml does: on this runner the
      # suite passes and the interpreter then crashes in DLL teardown on the
      # way out, which a bare `pytest -q` reports as a failure. Bash rather
      # than PowerShell, so the shell is not a second thing that can decide
      # the result.
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_tests.py
