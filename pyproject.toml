description = "Windows dual-pane file manager"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pywin32>=306",
]

[project.urls]
Repository = "https://github.com/Robbuie/FileManager"

[tool.pytest.ini_options]
testpaths = ["tests"]
