[project]
name = "filemanager"
version = "0.29.9"
description = "Windows dual-pane file manager"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pywin32>=306",
]

[project.urls]
Repository = "https://github.com/Robbuie/FileManager"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so `app` imports. Not a convenience: pytest puts the
# *test file's* own directory on the path, not the root, so a bare `pytest`
# cannot see the package at all -- `python -m pytest` only works because the
# interpreter adds the working directory itself. The workflow runs the bare
# form, so the two have to agree, and this is the line that makes them.
pythonpath = ["."]
